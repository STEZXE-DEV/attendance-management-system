<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Frekwencja</title>
</head>
<body>

<h1>System frekwencji</h1>

<p>Obecni: {{ present_count }} / {{ students|length }}</p>

<a href="/reset">Reset</a>

<ul>
    {% for s in students %}
        <li>
            {{ s.name }} -

            {% if s.present %}
                ✔ obecny
            {% else %}
                ❌ nieobecny
            {% endif %}

            <a href="/toggle/{{ s.id }}">zmień</a>
        </li>
    {% endfor %}
</ul>

</body>
</html>
