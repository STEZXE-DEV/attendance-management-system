<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Ucznia</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .present { color: green; font-weight: bold; }
        .absent { color: red; font-weight: bold; }
        .late { color: orange; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Moja frekwencja</h1>

    <table>
        <tr>
            <th>Przedmiot</th>
            <th>Data</th>
            <th>Status</th>
        </tr>

        <tbody id="table"></tbody>
    </table>
</div>

<script>

const studentId = { student_id };

fetch(`/api/student/${studentId}/attendance`)
    .then(res => res.json())
    .then(data => {

        const table = document.getElementById("table");

        data.forEach(row => {

            let colorClass = "";
            if (row.status === "present") colorClass = "present";
            if (row.status === "absent") colorClass = "absent";
            if (row.status === "late") colorClass = "late";

            table.innerHTML += `
                <tr>
                    <td>${row.topic}</td>
                    <td>${row.lesson_date}</td>
                    <td class="${colorClass}">${row.status}</td>
                </tr>
            `;
        });
    });

</script>

</body>
</html>
