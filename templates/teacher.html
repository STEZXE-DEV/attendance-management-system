<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Nauczyciela</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            margin: 2px;
        }

        .present { background: #4caf50; color: white; }
        .absent { background: #f44336; color: white; }
    </style>
</head>
<body>

<div class="container">

    <h1>Panel Nauczyciela</h1>

    <table>
        <tr>
            <th>Uczeń</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>Adam Kowalski</td>
            <td>
                <button class="present">Obecny</button>
                <button class="absent">Nieobecny</button>
            </td>
        </tr>
    </table>

</div>

</body>
</html>
